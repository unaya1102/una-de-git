<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>한자어 외괘 · 汉字词外挂</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1e27; --card2:#232838; --fg:#e9edf5; --muted:#8b93a7;
    --accent:#5b8cff; --good:#2ecc71; --bad:#ff5d6c; --easy:#a78bfa; --line:#2a3040;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;
    display:flex;flex-direction:column;min-height:100vh;overscroll-behavior:none}
  header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:11px;color:var(--muted)}
  .progress{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
  .progress b{color:var(--accent)}
  main{flex:1;padding:0 16px 90px;max-width:680px;margin:0 auto;width:100%}
  .tab{display:none}
  .tab.active{display:block}

  /* study card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 20px;margin-top:8px;min-height:300px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .face-tag{font-size:11px;color:var(--muted);margin-bottom:18px;letter-spacing:1px}
  .hanja{font-size:64px;font-weight:700;line-height:1.1;letter-spacing:4px}
  .hangul-big{font-size:52px;font-weight:700;line-height:1.1}
  .hint{font-size:13px;color:var(--muted);margin-top:14px;min-height:18px}
  .reveal{margin-top:8px;width:100%;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .reveal .hangul{font-size:40px;font-weight:700}
  .reveal .mean{font-size:22px;margin-top:6px;color:var(--fg)}
  .reveal .roman{font-size:13px;color:var(--muted);margin-top:2px}
  .chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;min-width:56px}
  .chip .ch{font-size:22px;font-weight:700}
  .chip .ck{font-size:15px;color:var(--accent);margin-top:2px}
  .chip .cm{font-size:11px;color:var(--muted)}

  .btns{position:fixed;left:0;right:0;bottom:64px;display:flex;gap:8px;
    padding:8px 16px;max-width:680px;margin:0 auto}
  .btns button{flex:1;border:none;border-radius:14px;padding:15px 0;font-size:15px;
    font-weight:700;color:#0f1115}
  .b-show{background:var(--accent);color:#fff}
  .b-bad{background:var(--bad);color:#fff}
  .b-good{background:var(--good);color:#063}
  .b-easy{background:var(--easy);color:#fff}
  .sub-int{display:block;font-size:10px;font-weight:600;opacity:.85;margin-top:2px}

  .empty{text-align:center;color:var(--muted);margin-top:60px;line-height:1.7}
  .empty .em{font-size:40px}

  /* face switch */
  .faceswitch{display:flex;gap:6px;margin-top:12px;background:var(--card2);
    border-radius:12px;padding:4px}
  .faceswitch button{flex:1;border:none;background:transparent;color:var(--muted);
    padding:9px 0;border-radius:9px;font-size:13px;font-weight:600}
  .faceswitch button.on{background:var(--accent);color:#fff}

  /* table */
  .group{margin-top:18px}
  .group h3{font-size:13px;color:var(--accent);margin:0 0 8px;letter-spacing:1px}
  .htable{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
  .hcell{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 6px;text-align:center}
  .hcell .h{font-size:26px;font-weight:700}
  .hcell .k{font-size:16px;color:var(--accent);margin-top:2px}
  .hcell .m{font-size:11px;color:var(--muted)}

  /* stats / settings */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .n{font-size:28px;font-weight:800;color:var(--accent)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .row{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-top:10px}
  .row label{font-size:14px}
  .row input{width:72px;background:var(--card2);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:8px;font-size:15px;text-align:center}
  .row .desc{font-size:11px;color:var(--muted);margin-top:3px}
  .danger{background:transparent;border:1px solid var(--bad);color:var(--bad);
    border-radius:12px;padding:12px;width:100%;margin-top:18px;font-size:14px;font-weight:600}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:18px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#11141c;
    border-top:1px solid var(--line);display:flex;max-width:680px;margin:0 auto}
  nav button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  nav button .ic{font-size:20px}
  nav button.on{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div><h1>한자어 외괘</h1><div class="sub">汉字词外挂 · 中文母语者专属</div></div>
  <div class="progress" id="prog"></div>
</header>

<main>
  <!-- STUDY -->
  <section class="tab active" id="tab-study">
    <div class="faceswitch" id="faceSwitch">
      <button data-face="hanja" class="on">汉字 → 推读音/意思</button>
      <button data-face="hangul">한글 → 推意思</button>
    </div>
    <div id="studyArea"></div>
  </section>

  <!-- TABLE -->
  <section class="tab" id="tab-table"></section>

  <!-- STATS -->
  <section class="tab" id="tab-stats">
    <div class="stat-grid">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">词库总数</div></div>
      <div class="stat"><div class="n" id="s-learned">0</div><div class="l">已开始学</div></div>
      <div class="stat"><div class="n" id="s-due">0</div><div class="l">今天待复习</div></div>
      <div class="stat"><div class="n" id="s-mature">0</div><div class="l">已稳固(≥7天)</div></div>
    </div>
    <div class="row">
      <div><label>每天新词上限</label><div class="desc">出差路上建议 20~40，先找你的真实上限</div></div>
      <input type="number" id="newPerDay" min="0" max="500" step="5">
    </div>
    <div class="note">
      <b>用法（再认导向）</b><br>
      1. 第一遍只求"眼熟"，别纠结拼写发音。<br>
      2. 没认出就点「몰라요」，它会被拎回来重背（这就是你说的"记不住的挑出来"）。<br>
      3. 复习时间点交给算法，按 5分→1天→2天→4天→7天→15天→30天 滚动。<br>
      4. 先用「汉字→推读音」练你的母语外挂，再用「한글→推意思」练实战再认。<br>
      5. 数据存在本机浏览器，<b>断网照常用</b>；换设备不会同步。
    </div>
    <button class="danger" id="resetBtn">清空所有学习进度</button>
  </section>
</main>

<div class="btns" id="btns"></div>

<nav>
  <button data-tab="study" class="on"><span class="ic">📚</span>학습</button>
  <button data-tab="table"><span class="ic">🀄</span>한자음표</button>
  <button data-tab="stats"><span class="ic">📊</span>통계</button>
</nav>

  {hanja:'重要',hangul:'중요',roman:'jungyo',mean:'重要',tags:['抽象'],chars:[{h:'重',k:'중',m:'重'},{h:'要',k:'요',m:'要'}]},
  {hanja:'注意',hangul:'주의',roman:'juui',mean:'注意',tags:['抽象'],chars:[{h:'注',k:'주',m:'注'},{h:'意',k:'의',m:'意'}]},

  {hanja:'計劃',hangul:'계획',roman:'gyehoek',mean:'计划',tags:['抽象'],chars:[{h:'計',k:'계',m:'计'},{h:'劃',k:'획',m:'划'}]},
  {hanja:'問題',hangul:'문제',roman:'munje',mean:'问题',tags:['抽象'],chars:[{h:'問',k:'문',m:'问'},{h:'題',k:'제',m:'题'}]},
  {hanja:'方法',hangul:'방법',roman:'bangbeop',mean:'方法',tags:['抽象'],chars:[{h:'方',k:'방',m:'方'},{h:'法',k:'법',m:'法'}]},
  {hanja:'生活',hangul:'생활',roman:'saenghwal',mean:'生活',tags:['抽象'],chars:[{h:'生',k:'생',m:'生'},{h:'活',k:'활',m:'活'}]},
  {hanja:'國家',hangul:'국가',roman:'gukga',mean:'国家',tags:['抽象'],chars:[{h:'國',k:'국',m:'国'},{h:'家',k:'가',m:'家'}]},
  {hanja:'家族',hangul:'가족',roman:'gajok',mean:'家族/家人',tags:['抽象'],chars:[{h:'家',k:'가',m:'家'},{h:'族',k:'족',m:'族'}]},
  {hanja:'學生',hangul:'학생',roman:'haksaeng',mean:'学生',tags:['抽象'],chars:[{h:'學',k:'학',m:'学'},{h:'生',k:'생',m:'生'}]},
  {hanja:'先生',hangul:'선생',roman:'seonsaeng',mean:'老师/先生',tags:['抽象'],chars:[{h:'先',k:'선',m:'先'},{h:'生',k:'생',m:'生'}]},
  {hanja:'韓國',hangul:'한국',roman:'hanguk',mean:'韩国',tags:['抽象'],chars:[{h:'韓',k:'한',m:'韩'},{h:'國',k:'국',m:'国'}]},
  {hanja:'中國',hangul:'중국',roman:'jungguk',mean:'中国',tags:['抽象'],chars:[{h:'中',k:'중',m:'中'},{h:'國',k:'국',m:'国'}]},
  {hanja:'外國',hangul:'외국',roman:'oeguk',mean:'外国',tags:['抽象'],chars:[{h:'外',k:'외',m:'外'},{h:'國',k:'국',m:'国'}]},
];

</script>
<script>
/* 汉字词外挂 — SRS 引擎 + UI
   再认导向：低门槛第一遍 + 间隔重复 + “记不住的拎回来重背”。 */

const DAY = 86400000;
// box -> 下次间隔(天)。box0=刚学/没记住，10分钟内重来。
const INT = [10/1440, 1, 2, 4, 7, 15, 30, 60];
const MAXBOX = INT.length - 1;
const STORE = 'hanjaSRS_v1';

const todayStr = () => new Date().toISOString().slice(0,10);

function load(){
  let s;
  try { s = JSON.parse(localStorage.getItem(STORE)); } catch(e){ s = null; }
  if(!s) s = {};
  s.cards    = s.cards    || {};
  s.settings = s.settings || { newPerDay: 20 };
  s.face     = s.face     || 'hanja';
  if(s.day !== todayStr()){ s.day = todayStr(); s.newToday = 0; }
  s.newToday = s.newToday || 0;
  return s;
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

let state = load();
let queue = [];
let revealed = false;

/* ---------- 选卡 / 队列 ---------- */
function cardOf(w){ return state.cards[w.hanja]; }

function buildQueue(){
  const now = Date.now();
  const due = [], fresh = [];
  for(const w of WORDS){
    const c = cardOf(w);
    if(c && c.seen){
      if(c.due <= now) due.push(w.hanja);
    } else {
      fresh.push(w.hanja);
    }
  }
  due.sort((a,b)=> state.cards[a].due - state.cards[b].due);
  const room = Math.max(0, state.settings.newPerDay - state.newToday);
  const newPick = fresh.slice(0, room);
  // 复习优先在前，穿插新词
  queue = [];
  let di=0, ni=0;
  while(di<due.length || ni<newPick.length){
    if(di<due.length){ queue.push(due[di++]); }
    if(ni<newPick.length && (di % 3 === 0)){ queue.push(newPick[ni++]); }
    else if(di>=due.length && ni<newPick.length){ queue.push(newPick[ni++]); }
  }
}

function ensureCard(hanja){
  if(!state.cards[hanja]) state.cards[hanja] = { box:0, due:0, seen:false, lapses:0 };
  return state.cards[hanja];
}

/* ---------- 评分 ---------- */
function rate(kind){
  const hanja = queue[0];
  const w = WORDS.find(x=>x.hanja===hanja);
  const c = ensureCard(hanja);
  const wasNew = !c.seen;
  const now = Date.now();

  if(wasNew){ c.seen = true; state.newToday++; }

  if(kind==='again'){
    c.box = 0; c.lapses++; c.due = now + INT[0]*DAY;
  } else if(kind==='good'){
    c.box = Math.min((wasNew?0:c.box)+1, MAXBOX); c.due = now + INT[c.box]*DAY;
  } else if(kind==='easy'){
    c.box = Math.min((wasNew?0:c.box)+2, MAXBOX); c.due = now + INT[c.box]*DAY;
  }
  save();

  queue.shift();
  // 短间隔(10分钟内)= 本轮重来：拎回队列靠后位置
  if(c.due <= now + INT[0]*DAY + 1000){
    const pos = Math.min(queue.length, 7);
    queue.splice(pos, 0, hanja);
  }
  if(queue.length === 0) buildQueue();
  revealed = false;
  renderStudy(); renderProgress();
}

/* ---------- 渲染：学习 ---------- */
function humanInt(days){
  if(days < 1) return Math.round(days*24*60)+'분';
  if(days < 30) return Math.round(days)+'일';
  return Math.round(days/30)+'개월';
}
function nextInt(box, kind, wasNew){
  let b;
  if(kind==='again') b=0;
  else if(kind==='good') b=Math.min((wasNew?0:box)+1,MAXBOX);
  else b=Math.min((wasNew?0:box)+2,MAXBOX);
  return humanInt(INT[b]);
}

function charsHTML(w){
  return '<div class="chars">' + w.chars.map(c=>
    `<div class="chip"><div class="ch">${c.h}</div><div class="ck">${c.k}</div><div class="cm">${c.m}</div></div>`
  ).join('') + '</div>';
}

function renderStudy(){
  const area = document.getElementById('studyArea');
  const btns = document.getElementById('btns');
  if(queue.length === 0){
    area.innerHTML = `<div class="empty"><div class="em">🎉</div>
      <b>今天的卡片都过完了！</b><br>
      没有待复习的词了。<br>想多学就去「통계」调高每天新词上限。</div>`;
    btns.innerHTML = '';
    return;
  }
  const hanja = queue[0];
  const w = WORDS.find(x=>x.hanja===hanja);
  const c = cardOf(w);
  const wasNew = !c || !c.seen;
  const face = state.face;

  let front, reveal;
  if(face === 'hanja'){
    front = `<div class="face-tag">看汉字 · 推韩语读音 + 意思</div>
             <div class="hanja">${w.hanja}</div>
             <div class="hint">${wasNew?'🆕 新词':''}</div>`;
    reveal = `<div class="reveal">
      <div class="hangul">${w.hangul}</div>
      <div class="roman">[${w.roman}]</div>
      <div class="mean">${w.mean}</div>
      ${charsHTML(w)}</div>`;
  } else {
    front = `<div class="face-tag">看韩文 · 推中文意思</div>
             <div class="hangul-big">${w.hangul}</div>
             <div class="hint">${wasNew?'🆕 新词':''}</div>`;
    reveal = `<div class="reveal">
      <div class="hangul" style="font-size:30px">${w.hanja}</div>
      <div class="roman">[${w.roman}]</div>
      <div class="mean">${w.mean}</div>
      ${charsHTML(w)}</div>`;
  }

  area.innerHTML = `<div class="card">${front}${revealed?reveal:''}</div>`;

  if(!revealed){
    btns.innerHTML = `<button class="b-show" onclick="doReveal()">보기 · 揭晓</button>`;
  } else {
    btns.innerHTML = `
      <button class="b-bad"  onclick="rate('again')">몰라요<span class="sub-int">${nextInt(c?c.box:0,'again',wasNew)}</span></button>
      <button class="b-good" onclick="rate('good')">알아요<span class="sub-int">${nextInt(c?c.box:0,'good',wasNew)}</span></button>
      <button class="b-easy" onclick="rate('easy')">쉬워요<span class="sub-int">${nextInt(c?c.box:0,'easy',wasNew)}</span></button>`;
  }
}
function doReveal(){ revealed = true; renderStudy(); }

/* ---------- 渲染：进度 / 统计 ---------- */
function renderProgress(){
  const now = Date.now();
  let learned=0, due=0, mature=0;
  for(const w of WORDS){
    const c = cardOf(w);
    if(c && c.seen){
      learned++;
      if(c.due <= now) due++;
      if(c.box >= 4) mature++;
    }
  }
  document.getElementById('prog').innerHTML =
    `今日新词 <b>${state.newToday}</b>/${state.settings.newPerDay}<br>待复习 <b>${due}</b> · 已学 <b>${learned}</b>/${WORDS.length}`;
  document.getElementById('s-total').textContent   = WORDS.length;
  document.getElementById('s-learned').textContent = learned;
  document.getElementById('s-due').textContent     = due;
  document.getElementById('s-mature').textContent  = mature;
}

/* ---------- 渲染：汉字音表 ---------- */
function renderTable(){
  const el = document.getElementById('tab-table');
  el.innerHTML = `<div class="note">背熟这些「汉字 → 固定韩音」对应，就能<b>批量推出</b>大量汉字词的读音。这是中文母语者最大的捷径。</div>` +
    HANJA_TABLE.map(g=>`
      <div class="group"><h3>${g.group}</h3>
        <div class="htable">${g.items.map(it=>
          `<div class="hcell"><div class="h">${it.h}</div><div class="k">${it.k}</div><div class="m">${it.m}</div></div>`
        ).join('')}</div></div>`).join('');
}

/* ---------- 导航 / 设置 ---------- */
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  const btns = document.getElementById('btns');
  btns.style.display = (name==='study') ? 'flex' : 'none';
  if(name==='study'){ buildQueue(); renderStudy(); }
  if(name==='stats'){ renderProgress(); }
}

document.querySelectorAll('nav button').forEach(b=>
  b.addEventListener('click', ()=>showTab(b.dataset.tab)));

document.querySelectorAll('#faceSwitch button').forEach(b=>
  b.addEventListener('click', ()=>{
    state.face = b.dataset.face; save();
    document.querySelectorAll('#faceSwitch button').forEach(x=>x.classList.toggle('on', x===b));
    revealed=false; renderStudy();
  }));

const npd = document.getElementById('newPerDay');
npd.value = state.settings.newPerDay;
npd.addEventListener('change', ()=>{
  state.settings.newPerDay = Math.max(0, parseInt(npd.value)||0);
  save(); buildQueue(); renderStudy(); renderProgress();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('确定清空所有学习进度？此操作不可恢复。')){
    localStorage.removeItem(STORE); state = load();
    npd.value = state.settings.newPerDay;
    buildQueue(); renderStudy(); renderProgress(); showTab('study');
  }
});

/* ---------- 启动 ---------- */
document.querySelectorAll('#faceSwitch button').forEach(x=>
  x.classList.toggle('on', x.dataset.face===state.face));
renderTable();
buildQueue();
renderStudy();
renderProgress();

</script>
