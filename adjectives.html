<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>형용사 40 · 词卡</title>
</head>
<body>
<style>
:root{
  --paper:#E9E7E1; --card:#FCFBF9; --ink:#17171B; --ink2:#56555C;
  --line:#C9C6BE; --line2:#DEDBD4; --seal:#C33C22; --blue:#2E5A8A;
  --ok:#3F6B4A; --sealbg:rgba(195,60,34,.10); --shadow:rgba(23,23,27,.22);
  --kr:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Nanum Gothic',system-ui,sans-serif;
  --cn:'Songti SC','Noto Serif CJK SC','Noto Serif SC','SimSun',serif;
  --ui:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131315; --card:#1C1C20; --ink:#EAE8E2; --ink2:#93919A;
    --line:#34343A; --line2:#26262B; --seal:#E4674A; --blue:#7FA9D6;
    --ok:#7FB48C; --sealbg:rgba(228,103,74,.14); --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#131315; --card:#1C1C20; --ink:#EAE8E2; --ink2:#93919A;
  --line:#34343A; --line2:#26262B; --seal:#E4674A; --blue:#7FA9D6;
  --ok:#7FB48C; --sealbg:rgba(228,103,74,.14); --shadow:rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --paper:#E9E7E1; --card:#FCFBF9; --ink:#17171B; --ink2:#56555C;
  --line:#C9C6BE; --line2:#DEDBD4; --seal:#C33C22; --blue:#2E5A8A;
  --ok:#3F6B4A; --sealbg:rgba(195,60,34,.10); --shadow:rgba(23,23,27,.22);
}

*{box-sizing:border-box}
.wrap{
  background:var(--paper); color:var(--ink); font-family:var(--ui);
  min-height:100dvh; margin:0 auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  max-width:600px; display:flex; flex-direction:column; gap:16px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--seal); outline-offset:3px}

/* ---- header ---- */
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:10px}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand .t{font-family:var(--kr); font-size:20px; font-weight:700; letter-spacing:-.01em}
.brand .n{font-family:var(--mono); font-size:12px; color:var(--ink2); letter-spacing:.06em}
.viewbtn{font-size:13px; letter-spacing:.04em; color:var(--ink2); border-bottom:1px solid var(--line); padding-bottom:2px; white-space:nowrap}
.viewbtn:hover{color:var(--ink); border-color:var(--ink)}

/* ---- chips ---- */
.bar{display:flex; flex-direction:column; gap:9px}
.row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.lab{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--ink2); text-transform:uppercase; width:100%; margin-bottom:-2px}
.chip{
  font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:2px;
  color:var(--ink2); background:var(--card); line-height:1.35;
}
.chip:hover{border-color:var(--ink2); color:var(--ink)}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chip .c{font-family:var(--mono); font-size:10px; opacity:.6; margin-left:5px}
.chip.kr{font-family:var(--kr)}

/* ---- progress ---- */
.meter{display:flex; align-items:center; gap:10px}
.track{flex:1; height:3px; background:var(--line2); position:relative; overflow:hidden}
.fill{position:absolute; inset:0 auto 0 0; background:var(--seal); width:0; transition:width .25s ease}
.count{font-family:var(--mono); font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---- card ---- */
.stage{perspective:1400px}
.card{
  display:block; width:100%; text-align:left; position:relative;
  min-height:clamp(310px,54vh,430px);
  transform-style:preserve-3d; transition:transform .42s cubic-bezier(.2,.75,.25,1);
}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--ink); border-radius:3px;
  box-shadow:4px 4px 0 var(--shadow);
  padding:22px; display:flex; flex-direction:column;
}
.face.back{transform:rotateY(180deg); overflow-y:auto; gap:14px}

.corner{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.idx{font-family:var(--mono); font-size:11px; color:var(--ink2); letter-spacing:.1em; font-variant-numeric:tabular-nums}
.seal{
  font-family:var(--kr); font-size:15px; font-weight:700; color:var(--seal);
  border:1.5px solid var(--seal); background:var(--sealbg); border-radius:3px;
  width:34px; height:34px; display:grid; place-items:center; transform:rotate(6deg); flex:none;
}
.seal.soft{color:var(--ink2); border-color:var(--line); background:none; transform:none; font-size:13px; font-weight:600}

.mid{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; text-align:center; padding:6px 0}
.word{font-family:var(--kr); font-size:clamp(2.5rem,11vw,3.9rem); font-weight:700; letter-spacing:-.03em; line-height:1.06; text-wrap:balance}
.word.sm{font-size:clamp(2rem,8.5vw,3rem)}
.mean{font-family:var(--cn); font-size:clamp(1.9rem,8vw,2.7rem); font-weight:600; line-height:1.15; text-wrap:balance}
.ask{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--seal); text-transform:uppercase}
.hint{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink2); text-align:center; margin-top:auto}

/* ---- back detail ---- */
.ansmean{font-family:var(--cn); font-size:clamp(1.6rem,6.5vw,2.1rem); font-weight:600; line-height:1.2}
.answord{font-family:var(--kr); font-size:clamp(2rem,8vw,2.8rem); font-weight:700; letter-spacing:-.02em; line-height:1.1}
.answord em{font-style:normal; color:var(--seal)}
.headline{display:flex; flex-direction:column; gap:5px; align-items:center; text-align:center; padding-bottom:2px}
.pron{font-family:var(--mono); font-size:12px; color:var(--ink2)}
.grid{display:grid; grid-template-columns:auto 1fr; gap:7px 12px; align-items:baseline; border-top:1px solid var(--line2); padding-top:12px}
.k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink2); text-transform:uppercase; white-space:nowrap}
.v{font-family:var(--kr); font-size:17px; font-weight:600; line-height:1.35}
.v em{font-style:normal; color:var(--seal)}
.deriv{
  font-family:var(--kr); font-size:15px; line-height:1.5; color:var(--ink);
  border-left:2px solid var(--seal); background:var(--sealbg); padding:9px 12px; border-radius:0 2px 2px 0;
}
.deriv .rl{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--seal); display:block; margin-bottom:3px; text-transform:uppercase}
.ant{display:flex; align-items:center; justify-content:center; gap:10px; border-top:1px solid var(--line2); padding-top:11px; font-family:var(--kr); font-size:17px}
.ant .ar{color:var(--ink2); font-size:14px}
.ant .aw{font-weight:600}
.ant .am{font-family:var(--cn); color:var(--ink2); font-size:14px}
.mixn{font-size:13px; line-height:1.55; color:var(--blue); border-left:2px solid var(--blue); padding-left:10px}
.mixn b{font-family:var(--kr); font-weight:600}
.hanja{font-size:13px; line-height:1.55; color:var(--ink2)}
.hanja b{font-family:var(--cn); color:var(--ink); font-size:15px}

/* ---- actions ---- */
.acts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.act{
  border:1px solid var(--ink); border-radius:3px; padding:13px 8px; background:var(--card);
  display:flex; flex-direction:column; align-items:center; gap:2px; box-shadow:3px 3px 0 var(--shadow);
  transition:transform .08s ease, box-shadow .08s ease;
}
.act:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--shadow)}
.act .kr{font-family:var(--kr); font-size:17px; font-weight:700}
.act .cn{font-family:var(--cn); font-size:12px; color:var(--ink2)}
.act.no{border-color:var(--seal); color:var(--seal)}
.act.no .cn{color:var(--seal); opacity:.75}
.act.yes{border-color:var(--ok); color:var(--ok)}
.act.yes .cn{color:var(--ok); opacity:.75}
.acts.hide{visibility:hidden}

/* ---- done ---- */
.done{background:var(--card); border:1px solid var(--ink); border-radius:3px; box-shadow:4px 4px 0 var(--shadow); padding:24px 20px; display:flex; flex-direction:column; gap:16px; text-align:center}
.done .big{font-family:var(--kr); font-size:26px; font-weight:700}
.done .sub{font-family:var(--cn); font-size:14px; color:var(--ink2); line-height:1.6}
.misslist{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.misslist span{font-family:var(--kr); font-size:15px; border:1px solid var(--seal); color:var(--seal); border-radius:2px; padding:3px 9px}
.done .acts{display:flex; gap:10px}
.done .act{flex:1}
.done .sub b{color:var(--seal)}

/* ---- list ---- */
.list{display:flex; flex-direction:column; gap:22px}
.grp{display:flex; flex-direction:column; gap:0}
.grph{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--ink2); text-transform:uppercase; padding-bottom:7px; border-bottom:1px solid var(--ink); margin-bottom:2px}
.item{display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:baseline; padding:11px 2px; border-bottom:1px solid var(--line2); text-align:left; width:100%}
.item:hover{background:var(--card)}
.item .w{font-family:var(--kr); font-size:19px; font-weight:700; letter-spacing:-.01em}
.item .w b{color:var(--seal); font-weight:700}
.item .m{font-family:var(--cn); font-size:16px; font-weight:600}
.item .f{font-family:var(--kr); font-size:13px; color:var(--ink2); grid-column:1}
.item .r{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--seal); text-align:right}
.item .r.soft{color:var(--ink2)}
.foot{font-size:11px; line-height:1.7; color:var(--ink2); font-family:var(--mono); text-align:center; border-top:1px solid var(--line); padding-top:12px}
.hidden{display:none !important}

@media (prefers-reduced-motion:reduce){
  .card,.fill,.act{transition:none}
}
</style>

 {k:"친절하다",ha:"친절합니다",he:"친절해요",md:"친절한",c:"亲切",r:"하",p:2,a:"",hj:"親切",hn:"全表<b>唯一</b>能用汉字外挂的词：친=親，절=切"},
 {k:"귀엽다",ha:"귀엽습니다",he:"귀여워요",md:"귀여운",c:"可爱",r:"ㅂ",p:2,a:"",u:"귀여우"},
 {k:"더럽다",ha:"더럽습니다",he:"더러워요",md:"더러운",c:"脏",r:"ㅂ",p:2,a:"깨끗하다",u:"더러우"},
 {k:"깨끗하다",ha:"깨끗합니다",he:"깨끗해요",md:"깨끗한",c:"干净",r:"하",p:2,a:"더럽다",pr:"깨끄타다"}
];

var RULE = {
  "ㅂ":{seal:"ㅂ", name:"ㅂ 불규칙", cn:"ㅂ 变 우"},
  "으":{seal:"ㅡ", name:"ㅡ 탈락",  cn:"ㅡ 脱落"},
  "르":{seal:"르", name:"르 불규칙", cn:"加 ㄹ"},
  "ㄹ":{seal:"ㄹ", name:"ㄹ 탈락",  cn:"ㄹ 脱落"},
  "하":{seal:"하", name:"하다 형용사", cn:"하다 类", soft:true},
  "있":{seal:"있", name:"있다 · 관형형 -는", cn:"定语用 -는", soft:true},
  "규":null
};

/* 派生：ㅂ 불규칙的推导过程从 u 生成，避免手写出错 */
W.forEach(function(w){
  if(w.r === "ㅂ" && !w.d) w.d = w.k.slice(0,-1) + " → " + w.u + " + 어요 → " + w.he;
});
var BY = {};
W.forEach(function(w){ BY[w.k] = w; });

var MODES = [
  {id:"kc", label:"한 → 中", sub:"看韩语想意思"},
  {id:"ck", label:"中 → 한", sub:"看中文想韩语"},
  {id:"cj", label:"활용", sub:"看原形说 해요체"}
];
var FILTERS = [
  {id:"all",  label:"전체",       kr:true,  f:function(){ return true; }},
  {id:"irr",  label:"ㅂ 불규칙",   kr:true,  f:function(w){ return w.r === "ㅂ"; }},
  {id:"vow",  label:"ㅡ·르·ㄹ",   kr:true,  f:function(w){ return w.r === "으" || w.r === "르" || w.r === "ㄹ"; }},
  {id:"ha",   label:"하다·있다",   kr:true,  f:function(w){ return w.r === "하" || w.r === "있"; }},
  {id:"mix",  label:"헷갈림 易混", kr:false, f:function(w){ return !!w.x; }},
  {id:"p1",   label:"1쪽",        kr:true,  f:function(w){ return w.p === 1; }},
  {id:"p2",   label:"2쪽",        kr:true,  f:function(w){ return w.p === 2; }},
  {id:"weak", label:"약한 카드",   kr:true,  f:function(w){ return (stats[w.k] || 0) > 0; }}
];

var STORE = "adjCards_v1";
var stats = {};
try{ stats = JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ stats = {}; }
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(stats)); }catch(e){} }

var mode = "kc", filter = "all", queue = [], pos = 0, total = 0, flipped = false, missed = [], listView = false;

var $ = function(id){ return document.getElementById(id); };
var el = {
  modes:$("modes"), filters:$("filters"), fill:$("fill"), count:$("count"),
  card:$("card"), front:$("front"), back:$("back"), acts:$("acts"),
  done:$("done"), list:$("list"), stage:$("stage"), meter:$("meter"),
  bar:$("bar"), foot:$("foot"), toggleView:$("toggleView")
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function pool(){
  var fo = FILTERS.filter(function(x){ return x.id === filter; })[0];
  return W.filter(fo.f);
}

function newRound(){
  queue = shuffle(pool().slice());
  total = queue.length; pos = 0; missed = []; flipped = false;
  render();
}

/* ---------- chips ---------- */
function buildChips(){
  MODES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "chip" + (m.id === mode ? " on" : "");
    b.type = "button";
    b.innerHTML = esc(m.label);
    b.title = m.sub;
    b.onclick = function(){ mode = m.id; flipped = false; rebuildChips(); render(); };
    el.modes.appendChild(b);
  });
  FILTERS.forEach(function(f){
    var n = W.filter(f.f).length;
    if(f.id === "weak" && n === 0) return;
    var b = document.createElement("button");
    b.className = "chip" + (f.kr ? " kr" : "") + (f.id === filter ? " on" : "");
    b.type = "button";
    b.innerHTML = esc(f.label) + '<span class="c">' + n + "</span>";
    b.onclick = function(){ filter = f.id; newRound(); rebuildChips(); };
    el.filters.appendChild(b);
  });
}
function rebuildChips(){
  el.modes.innerHTML = '<span class="lab">방향</span>';
  el.filters.innerHTML = '<span class="lab">범위</span>';
  buildChips();
}

/* ---------- faces ---------- */
function frontHTML(w, i){
  var r = RULE[w.r];
  /* 印章只在「한 → 中」出现：另外两个方向里它会泄题 */
  var sealHTML = (mode !== "kc" || !r) ? "" :
    '<span class="seal' + (r.soft ? " soft" : "") + '">' + esc(r.seal) + "</span>";
  var body;
  if(mode === "kc"){
    body = '<div class="word' + (w.k.length > 3 ? " sm" : "") + '">' + esc(w.k) + "</div>";
  }else if(mode === "ck"){
    body = '<div class="mean">' + esc(w.c) + "</div>";
  }else{
    body = '<span class="ask">해요체는?</span>' +
           '<div class="word' + (w.k.length > 3 ? " sm" : "") + '">' + esc(w.k) + "</div>";
  }
  return '<div class="corner"><span class="idx">' + (i + 1) + " / " + total + "</span>" + sealHTML + "</div>" +
         '<div class="mid">' + body + "</div>" +
         '<p class="hint">탭 · 翻面</p>';
}

function backHTML(w){
  var r = RULE[w.r];
  var h = '<div class="corner"><span class="idx">' + esc(w.k) + "</span>" +
          (r ? '<span class="seal' + (r.soft ? " soft" : "") + '">' + esc(r.seal) + "</span>" : "") +
          "</div>";

  if(mode === "cj"){
    h += '<div class="headline"><div class="answord"><em>' + esc(w.he) + "</em></div>" +
         '<div class="pron">' + esc(w.c) + " · " + (r ? esc(r.name) : "규칙") + "</div></div>";
  }else if(mode === "ck"){
    h += '<div class="headline"><div class="answord">' + esc(w.k) + "</div>" +
         (w.pr ? '<div class="pron">[' + esc(w.pr) + "]</div>" : "") + "</div>";
  }else{
    h += '<div class="headline"><div class="ansmean">' + esc(w.c) + "</div>" +
         (w.pr ? '<div class="pron">[' + esc(w.pr) + "]</div>" : "") + "</div>";
  }

  h += '<div class="grid">' +
       '<span class="k">합니다</span><span class="v">' + esc(w.ha) + "</span>" +
       '<span class="k">해요</span><span class="v">' + esc(w.he) + "</span>" +
       '<span class="k">관형</span><span class="v">' + esc(w.md) + " N</span>" +
       "</div>";

  if(w.d){
    h += '<div class="deriv"><span class="rl">' + esc(r.name) + " · " + esc(r.cn) + "</span>" + esc(w.d) + "</div>";
  }
  if(w.a && BY[w.a]){
    h += '<div class="ant"><span class="ar">↔</span><span class="aw">' + esc(w.a) +
         '</span><span class="am">' + esc(BY[w.a].c) + "</span></div>";
  }
  if(w.xn) h += '<p class="mixn">vs <b>' + esc(w.x) + "</b>　" + w.xn + "</p>";
  if(w.n)  h += '<p class="hanja">' + w.n + "</p>";
  if(w.hn) h += '<p class="hanja"><b>' + esc(w.hj) + "</b>하다　" + w.hn + "</p>";
  return h;
}

/* ---------- render ---------- */
function render(){
  if(listView) return;
  el.fill.style.width = total ? (pos / total * 100) + "%" : "0%";
  el.count.textContent = pos + " / " + total;

  if(pos >= total){
    el.stage.classList.add("hidden");
    el.acts.classList.add("hidden");
    el.done.classList.remove("hidden");
    var uniq = missed.filter(function(v, i, s){ return s.indexOf(v) === i; });
    el.done.innerHTML =
      '<div class="big">' + (uniq.length ? "한 바퀴 끝!" : "다 맞았어요") + "</div>" +
      '<p class="sub">' + total + " 张过完" +
      (uniq.length ? "，其中 <b>" + uniq.length + "</b> 张标了「몰라요」——这些就是要拎回来重背的。" : "，这一轮全部记住了。") +
      "</p>" +
      (uniq.length ? '<div class="misslist">' + uniq.map(function(k){ return "<span>" + esc(k) + "</span>"; }).join("") + "</div>" : "") +
      '<div class="acts">' +
      (uniq.length ? '<button class="act no" id="againMiss"><span class="kr">틀린 것만</span><span class="cn">只练错的 ' + uniq.length + "</span></button>" : "") +
      '<button class="act yes" id="againAll"><span class="kr">처음부터</span><span class="cn">整轮重来</span></button>' +
      "</div>";
    if($("againMiss")) $("againMiss").onclick = function(){
      queue = shuffle(uniq.map(function(k){ return BY[k]; }));
      total = queue.length; pos = 0; missed = []; flipped = false;
      el.done.classList.add("hidden"); el.stage.classList.remove("hidden"); el.acts.classList.remove("hidden");
      render();
    };
    $("againAll").onclick = newRound;
    return;
  }

  el.done.classList.add("hidden");
  el.stage.classList.remove("hidden");
  el.acts.classList.remove("hidden");
  var w = queue[pos];
  el.card.classList.toggle("flip", flipped);
  el.front.innerHTML = frontHTML(w, pos);
  el.back.innerHTML = backHTML(w);
  el.acts.classList.toggle("hide", !flipped);
  el.card.setAttribute("aria-label", flipped ? w.k + " " + w.c : "카드 " + (pos + 1));
}

function flip(){ if(pos < total){ flipped = !flipped; render(); } }
function answer(ok){
  if(!flipped || pos >= total) return;
  var w = queue[pos];
  if(ok){
    if(stats[w.k]) { stats[w.k] = Math.max(0, stats[w.k] - 1); if(!stats[w.k]) delete stats[w.k]; }
    pos++;
  }else{
    stats[w.k] = (stats[w.k] || 0) + 1;
    missed.push(w.k);
    queue.push(w); total++;
    pos++;
  }
  persist();
  flipped = false;
  render();
}

/* ---------- list ---------- */
function buildList(){
  el.list.innerHTML = "";
  [1, 2].forEach(function(p){
    var g = document.createElement("div");
    g.className = "grp";
    var head = document.createElement("div");
    head.className = "grph";
    head.textContent = p === 1 ? "1쪽 · 大小 高低 冷热 难易" : "2쪽 · 明暗 贵贱 轻重 外貌";
    g.appendChild(head);
    W.filter(function(w){ return w.p === p; }).forEach(function(w){
      var r = RULE[w.r];
      var b = document.createElement("button");
      b.className = "item";
      b.type = "button";
      b.innerHTML =
        '<span class="w">' + esc(w.k) + (w.r === "ㄹ" ? " <b>★</b>" : "") + "</span>" +
        '<span class="m">' + esc(w.c) + "</span>" +
        '<span class="f">' + esc(w.ha) + " · " + esc(w.he) + " · " + esc(w.md) + " N</span>" +
        '<span class="r' + (!r || r.soft ? " soft" : "") + '">' + (r ? esc(r.name) : "규칙") + "</span>";
      b.onclick = function(){
        var i = queue.map(function(q){ return q.k; }).indexOf(w.k);
        if(i < 0){ queue.splice(pos, 0, w); i = pos; total++; }
        pos = i; flipped = false;
        setView(false); render();
      };
      g.appendChild(b);
    });
    el.list.appendChild(g);
  });
}

function setView(toList){
  listView = toList;
  el.list.classList.toggle("hidden", !toList);
  el.stage.classList.toggle("hidden", toList);
  el.acts.classList.toggle("hidden", toList);
  el.meter.classList.toggle("hidden", toList);
  el.bar.classList.toggle("hidden", toList);
  el.done.classList.add("hidden");
  el.foot.textContent = toList ? "탭해서 그 카드로 이동 · 点一行跳到那张卡" : "탭 = 뒤집기 · SPACE 翻面 · ← 不会 · → 会了";
  el.toggleView.textContent = toList ? "카드 卡片" : "목록 一览";
  if(toList) buildList(); else render();
}

/* ---------- wire ---------- */
el.card.onclick = flip;
$("btnNo").onclick = function(e){ e.stopPropagation(); answer(false); };
$("btnYes").onclick = function(e){ e.stopPropagation(); answer(true); };
el.toggleView.onclick = function(){ setView(!listView); };
document.addEventListener("keydown", function(e){
  if(listView) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowLeft"){ answer(false); }
  else if(e.key === "ArrowRight"){ answer(true); }
});

buildChips();
newRound();
})();
</script>
</body>
</html>
